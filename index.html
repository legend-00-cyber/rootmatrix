<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootMatrix - Advanced Cyber Security & Tools Hub</title>
    <style>
        body { background-color: #0b0f19; color: #00ff66; font-family: monospace; text-align: center; padding: 30px 15px; margin: 0; }
        h1 { color: #00ffcc; font-size: 2.3em; text-shadow: 0 0 15px rgba(0,255,204,0.4); letter-spacing: 2px; }
        p { color: #8ab4f8; font-size: 1.1em; }
        .card { background: #131c31; border: 1px solid #1f305e; padding: 20px; margin: 20px auto; max-width: 500px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.6); }
        .cmd { background: #05070d; color: #ff0055; padding: 12px; display: block; border-radius: 6px; margin-top: 10px; font-size: 1em; border: 1px solid #2a1b3d; }
        .status { color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚡ ROOTMATRIX ⚡</h1>
    <p>Next-Gen Mobile Security & Terminal Architecture</p>
    
    <div class="card">
        <h3>🛡️ Core Utility: Local Exfiltration</h3>
        <p>Deploy a lightweight server instantly:</p>
        <div class="cmd">python3 -m http.server 8080</div>
    </div>

    <div class="card">
        <h3>🔍 Network Intelligence</h3>
        <p>Inspect active routing and interfaces:</p>
        <div class="cmd">ifconfig</div>
    </div>

    <div class="card">
        <h3>🚀 System Deployment</h3>
        <p class="status">[ Status: Online & Secured ]</p>
    </div>
</body>
</html>
